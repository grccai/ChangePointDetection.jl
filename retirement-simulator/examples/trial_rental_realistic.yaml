# Rental property with the granular operating-cost + shock + refinance
# model. The legacy `expense_ratio` lump is set to 0; specific component
# rates replace it. Order-of-magnitude calibration for a $858k SFR in
# CA matching the v4 optimization result:
#
#   property tax:    1.1% of value/yr  (CA Prop 13 ~1.0-1.25%)
#   insurance:       0.5% of value/yr  (~$4k/yr on $858k; high-fire-risk)
#   maintenance:     0.8% of value/yr  (~$7k/yr; routine repairs)
#   management fee:  8% of gross rent  (typical CA SFR rate)
#   legal/ins:       $1500/yr real     (LLC fees + $1M umbrella policy)
#
#   tenant turnover: 25%/yr P, 2 months vacant, 5% of rent in costs.
#   capex shocks:    10%/yr P, lognormal mean 2% of value, σ=0.6.
#                    Expected drag: 0.20%/yr; left tail occasionally 5%+.
#
#   refinance:       check yearly (after 5y cooldown). Refi if locked
#                    rate >= market + 1.5pp. Market rate AR(1) on log,
#                    long-run mean 6% nominal, ann. log-vol 7%, alpha 0.85.
#                    2.5% closing costs paid out of cash flow this year.
rental_property:
  price_real:           858000   # v4 robust optimum price
  downpayment_frac:     0.25
  mortgage_term_years:  30
  mortgage_nominal_rate: 0.07
  cap_rate:             0.06
  expense_ratio:        0.0      # legacy lump zeroed out; granular below
  rent_shock_vol:       0.07
  appreciation_real_mean: 0.005
  appreciation_real_vol:  0.10
  correlation_with_stock: 0.30
  correlation_with_bond:  0.10
  location_state:       CA       # v4 robust optimum
  ltv_max:              0.80
  heloc_rate_nominal:   0.08

  # Granular operating costs (additive on expense_ratio, which is 0 here)
  property_tax_rate:    0.011
  insurance_rate:       0.005
  maintenance_rate:     0.008
  management_fee_frac:  0.08
  legal_insurance_real: 1500

  trigger:
    min_age:                  40.7    # v4 robust optimum
    min_liquid_real_wealth:   769316
    min_taxable_real_wealth:  382221

  turnover:
    annual_prob:        0.25
    months_vacant:      2.0
    cost_frac:          0.05

  capex:
    annual_prob:        0.10
    mean_frac:          0.02
    lognormal_sigma:    0.6

  refinance:
    enabled:               true
    rate_drop_threshold:   0.015
    closing_cost_frac:     0.025
    cooldown_years:        5
    new_term_years:        30
    market_rate_mean:      0.06   # long-run nominal 30y rate
    market_rate_log_vol:   0.07
    market_rate_ar1_alpha: 0.85
