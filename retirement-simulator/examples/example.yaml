# Example scenario: 35-year-old single filer, FIRE around 50, plan to age 95.
# All dollar values are in TODAY'S dollars unless explicitly nominal.
# Real returns are post-inflation.

profile:
  birthdate:        1991-04-15      # determines age throughout the plan
  start_date:       2026-05-05      # first simulated year starts here
  retirement_date:  2041-05-05      # FIRE
  end_of_plan_date: 2086-05-05      # end of horizon
  filing_status:    single          # 'single' or 'mfj'

# Each income source has a state, [start, end), an annual gross amount in
# year-1 dollars, and an annual growth_rate (nominal). Multiple concurrent
# sources stack; mid-year transitions pro-rate by fraction-of-year.
income:
  sources:
    - {state: CA, start: 2026-05-05, end: 2030-08-01, gross_annual: 200000, growth_rate: 0.03}
    - {state: WA, start: 2030-08-01, end: 2041-05-05, gross_annual: 250000, growth_rate: 0.025}
    # Side gig: half-time consulting in OR for two years overlapping the WA job.
    - {state: OR, start: 2032-01-01, end: 2034-01-01, gross_annual:  60000, growth_rate: 0.0}

# Where you LIVE (taxes investment income, RMDs, conversions). Independent
# of where you WORK (which is per income source).
state_taxes:
  residency:
    - {state: CA, start: 2026-05-05, end: 2030-08-01}     # while working in CA
    - {state: WA, start: 2030-08-01, end: 2086-05-05}     # move to WA, stay forever

savings:
  rate: 0.40                   # 40% of total gross wages
  contributions:
    trad_401k: max             # max out (uses IRS limit + catchup if 50+)
    roth_401k: 0
    trad_ira: 0
    roth_ira: 7000             # backdoor implicit if income is high
    mega_backdoor_roth: max    # after-tax 401k -> Roth (up to 415(c) limit)
    employer_match_rate: 0.05  # 5% of gross matched into traditional 401k

spending:
  annual_real: 80000
  smile: bengen                # 'flat' or 'bengen'

initial_portfolio:
  taxable:
    lots:
      - {asset: stock, market_value: 150000, cost_basis: 90000, age_years: 3.0}
      - {asset: stock, market_value:   5000, cost_basis:  5000, age_years: 0.4}  # ST
      - {asset: bond,  market_value:  30000, cost_basis: 28000, age_years: 2.0}
      - {asset: cash,  market_value:  20000, cost_basis: 20000, age_years: 5.0}
  traditional:
    stock: 250000
    bond:   50000
    cash:       0
  roth:
    stock:  80000
    bond:       0
    cash:       0
    basis:  35000              # contributions to date

target_allocations:
  taxable:
    stock: 0.85
    bond: 0.05
    cash: 0.10
  traditional:
    stock: 0.50
    bond: 0.50
    cash: 0.00
  roth:
    stock: 1.00
    bond: 0.00
    cash: 0.00

market:
  stocks: {real_return: 0.06, vol: 0.18}
  bonds:  {real_return: 0.02, vol: 0.06}
  cash:   {real_return: 0.005, vol: 0.01}
  inflation_mean: 0.025
  inflation_vol: 0.0
  correlation_stock_bond: 0.10
  correlation_stock_cash: 0.0
  correlation_bond_cash: 0.0

social_security:
  monthly_at_67: 2500
  claim_age: 67

withdrawal:
  strategy: tax_aware
  roth_conversion_target_bracket: 0.12
  aca_magi_cap: 50000          # null disables ACA cliff awareness

simulation:
  n_paths: 5000
  seed: 42
  return_model: gbm
