[project]
name = "retirement-simulator"
version = "0.1.0"
description = "Tax-aware retirement portfolio simulation and allocation optimizer."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.scripts]
retire = "retire.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retire*"]
